name: deploy-staging

# Builds the app on GitHub (PHP 8.4 + Node) and uploads it to the cPanel staging site over SSH.
# Setup: docs/DEPLOY-STAGING.md. Nothing deploys until the repository variable STAGING_ENABLED is "true".

on:
  push:
    branches: [main, staging, 'claude/brave-fermat-5h2y4z']
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, gd, exif, zip, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: php artisan apq:lang:check
      - run: php artisan test

  deploy:
    needs: test
    if: vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://apqcleaner.spinstaging.com
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      APP_PATH: ${{ secrets.STAGING_APP_PATH }}
      PHP_BIN: ${{ vars.STAGING_PHP_BIN || 'php' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, gd, exif, zip
          coverage: none
      - name: Install PHP dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build front-end assets
        run: npm ci && npm run build

      - name: Configure SSH
        id: ssh
        env:
          SSH_PASSPHRASE: ${{ secrets.STAGING_SSH_PASSPHRASE }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # cPanel-generated keys require a passphrase: unlock the runner's throwaway copy so ssh/rsync run non-interactively.
          if [ -n "$SSH_PASSPHRASE" ]; then
            ssh-keygen -p -q -P "$SSH_PASSPHRASE" -N "" -f ~/.ssh/deploy_key >/dev/null \
              || { echo "::error::Could not unlock STAGING_SSH_KEY — check STAGING_SSH_PASSPHRASE"; exit 1; }
          fi

          # Pinned host keys. Accept entries with or without the port ("[host]:2222 key…" or "host key…"):
          # strip the port and look keys up under the host name via HostKeyAlias.
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' | grep -v '^#' | grep -v '^[[:space:]]*$' \
            | sed -E 's/^\[([^]]+)\]:[0-9]+ /\1 /' > ~/.ssh/known_hosts || true
          chmod 644 ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::STAGING_SSH_KNOWN_HOSTS is empty. On your computer run: ssh-keyscan -p $SSH_PORT <server> and paste the output into the secret."
            exit 1
          fi
          if ! cut -d' ' -f1 ~/.ssh/known_hosts | tr ',' '\n' | grep -qxF "$SSH_HOST"; then
            echo "::error::STAGING_SSH_KNOWN_HOSTS has no entry for the host in STAGING_SSH_HOST. Run ssh-keyscan against exactly that host (same IP or name) with -p $SSH_PORT."
            exit 1
          fi

          cat > ~/.ssh/config <<CFG
          Host staging
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            HostKeyAlias $SSH_HOST
            StrictHostKeyChecking yes
            ConnectTimeout 20
          CFG

          if ! ssh staging true; then
            echo "::error::SSH connection failed (see the message above). Host key → re-run ssh-keyscan with -p $SSH_PORT. 'Permission denied' → authorize the key in cPanel and check STAGING_SSH_USER."
            exit 1
          fi
          ssh staging "test -f '$APP_PATH/.env'" \
            || { echo "::error::Connected, but $APP_PATH/.env does not exist — see docs/DEPLOY-STAGING.md step 5"; exit 1; }

      - name: Maintenance mode on
        run: ssh staging "cd '$APP_PATH' && [ -f artisan ] && $PHP_BIN artisan down --retry=30 || true"

      - name: Upload
        run: |
          rsync -az --delete --exclude-from=.github/deploy-exclude.txt ./ "staging:$APP_PATH/"

      - name: Migrate and warm caches
        run: |
          ssh staging "set -e
            cd '$APP_PATH'
            mkdir -p storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/import bootstrap/cache
            chmod -R ug+rwX storage bootstrap/cache
            $PHP_BIN artisan migrate --force
            $PHP_BIN artisan storage:link || true
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan optimize
            $PHP_BIN artisan queue:restart"

      - name: Maintenance mode off
        if: always() && steps.ssh.outcome == 'success'
        run: ssh staging "cd '$APP_PATH' && [ -f artisan ] && $PHP_BIN artisan up || true"

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://apqcleaner.spinstaging.com/up)
          echo "Health check returned $code"
          test "$code" = "200"
